[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xtfc-ponn-trajectory-optimization"
version = "1.0.0"
description = "Earth-Mars Low-Thrust Trajectory Optimization with X-TFC PoNN, Indirect Shooting, and Pseudospectral Collocation under J2 and SRP Perturbations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nirbaan"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
trajectory-opt = "main:main"
